<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Calcule seu IMC e Peso Ideal</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>

    <div class="container">
        <h2>Calcule seu IMC e Peso Ideal</h2>

        <div class="linha">
            <label>Informe seu peso (kg):</label>
            <input type="text" id="peso">
        </div>

        <div class="linha">
            <label>Informe sua altura (m):</label>
            <input type="text" id="altura">
        </div>

        <div class="linha">
            <label>Informe o sexo:</label>
            <input type="radio" name="sexo" id="feminino" value="F" checked>
            <label for="feminino">Feminino</label>

            <input type="radio" name="sexo" id="masculino" value="M">
            <label for="masculino">Masculino</label>
        </div>

        <div class="linha">
            <label>O valor do seu IMC é:</label>
            <input type="text" id="resultadoIMC" readonly>
        </div>

        <div class="linha">
            <label>Seu peso ideal é:</label>
            <input type="text" id="pesoIdeal" readonly>
        </div>

        <div class="resultado-caixa">
            <p id="mensagem"></p>
        </div>

        <div class="botoes">
            <input type="button" value="Calcular" onclick="calcular()">
            <input type="button" value="Limpar" onclick="limpar()">
        </div>
    </div>

    <script src="./src/js/script.js"></script>
</body>

</html>
